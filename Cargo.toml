[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV policy: current stable minus two releases (PLAN.md §3).
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/CPT-Dawn/Hoarder"
authors = ["Swastik Patel <CPT-Dawn@users.noreply.github.com>"]

[workspace.dependencies]
hoarder-config = { path = "crates/hoarder-config", version = "0.1.0" }
hoarder-e2e = { path = "crates/hoarder-e2e" }
hoarder-ipc = { path = "crates/hoarder-ipc", version = "0.1.0" }
hoarder-store = { path = "crates/hoarder-store", version = "0.1.0" }
hoarder-ui = { path = "crates/hoarder-ui", version = "0.1.0" }
hoarder-wayland = { path = "crates/hoarder-wayland", version = "0.1.0" }

calloop = "0.14"
clap = { version = "4.6", features = ["derive"] }
cosmic-text = "0.19"
futures-util = { version = "0.3", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "avif", "qoi", "rayon"] }
inotify = { version = "0.11", default-features = false }
jiff = "0.2"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustix = { version = "1.1", features = ["event", "fs", "net", "pipe", "process"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["xkbcommon"] }
tempfile = "3.27"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
toml_edit = { version = "0.25", features = ["serde"] }
# Lossy WebP only: `image` encodes WebP losslessly and nothing else.
webp = { version = "0.3.1", default-features = false }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# zbus 6 has no blocking API: drive it with `zbus::block_on`.
zbus = { version = "6.2", default-features = false, features = ["default-rt", "proxy"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# rav1e (AVIF) is unusably slow unoptimised; keep debug builds and tests snappy.
[profile.dev.package.rav1e]
opt-level = 3
