name: Feature request
description: Suggest something Hoarder should do.
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: Hoarder is feature-complete and in maintenance mode; features are added when users ask for them. Check the [non-goals](https://github.com/CPT-Dawn/Hoarder/blob/main/docs/adr/0008-non-goals.md) and the [parked ideas](https://github.com/CPT-Dawn/Hoarder/issues?q=label%3Aenhancement+is%3Aclosed) first: a thumbs-up or comment on one counts as a request.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
