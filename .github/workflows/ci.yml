# Hoarder CI — what each job does and how to run it locally: docs/testing.md
name: CI

on:
  push:
    branches: [main, "integration/**", "ticket/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install xkbcommon (smithay-client-toolkit links it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97
      - name: Install xkbcommon (smithay-client-toolkit links it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  test:
    name: tests (headless Sway)
    runs-on: ubuntu-latest
    # Arch ships a current Sway (1.11+: ext-data-control, ext-image-copy-capture);
    # Ubuntu's is too old for the protocols Hoarder targets.
    container: archlinux:latest
    env:
      CARGO_HOME: /cargo
    steps:
      - name: Install Sway, grim, wl-clipboard, libavif and Rust
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust sway grim wl-clipboard libavif xdg-utils shared-mime-info file xkeyboard-config
          # Arch gives sway cap_sys_nice, which an unprivileged container cannot
          # grant, so exec fails with EPERM. Headless tests don't need it.
          setcap -r "$(command -v sway)"
          sway --version
          cargo --version
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Sway is not meant to run as root, so the tests run as an unprivileged user.
      - name: Create test user
        run: |
          useradd --create-home tester
          mkdir -p "$CARGO_HOME"
          chown -R tester: "$CARGO_HOME" "$GITHUB_WORKSPACE"
      - name: cargo test
        run: runuser -u tester -- cargo test --workspace --locked
      # Latency budgets mean nothing in a debug build, so they run optimised.
      # Shared runners measure 1.3-1.7x a desktop on the 4K budgets; 3x keeps
      # headroom without hiding a real regression (docs/testing.md).
      - name: cargo test --release (timing budgets)
        env:
          HOARDER_BUDGET_SCALE: "3"
        run: >-
          runuser -u tester -- env HOARDER_BUDGET_SCALE="$HOARDER_BUDGET_SCALE"
          cargo test --release --locked -p hoarder
          --test e2e_shot_clipboard --test e2e_overlay
          -- 150_ms budget --nocapture

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
